[project]
name = "tensor-decomposer"
version = "0.1.0"
description = "Web Application for High-Dimensional Tensor and Matrix Decompositions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "numpy>=1.26",
    "pytest>=8.0",
    "scikit-learn>=1.3",
    "tensordecomp",
    "whitenoise>=6.6.0",
    "playwright>=1.40.0",
    "pytest-playwright>=0.4.0",
    "pytest-django>=4.8.0",
]

[tool.uv.sources]
tensordecomp = { path = "tensordecomp", editable = true }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_test.py"]
django_find_project = true
