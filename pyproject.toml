[project]
name = "tensor-decomposer"
version = "0.1.0"
description = "Web Application for High-Dimensional Tensor and Matrix Decompositions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "numpy>=1.26",
    "pytest>=8.0",
    "scikit-learn>=1.3",
    "tensordecomp",
    "whitenoise>=6.6.0",
]

[tool.uv.sources]
tensordecomp = { path = "tensordecomp", editable = true }
